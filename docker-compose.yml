services:
  finance-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-finance-calculator
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - SECRET_KEY=prod-secret-finance-key-321
      - DATA_DIR=/app/data
    volumes:
      - finance-data:/app/data

volumes:
  finance-data:
    driver: local
